{% extends "base.html" %}

{% block content %}

<div class="checkout">

    <h1>Checkout</h1>

    <form method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            required
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >

        <label>
            Address
        </label>

        <textarea
            name="address"
            required
        ></textarea>

        <button
            type="submit"
            class="button"
        >
            Place Order
        </button>

    </form>

</div>

{% endblock %}
