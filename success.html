{% extends "base.html" %}

{% block content %}

<div class="success">

    <h1>🎉 Order Placed Successfully!</h1>

    <p>
        Thank you for shopping with ShopEasy.
    </p>

    <p>
        Your Order ID is:
        <strong>#{{ order_id }}</strong>
    </p>

    <a
        class="button"
        href="{{ url_for('home') }}"
    >
        Continue Shopping
    </a>

</div>

{% endblock %}
