<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <h2>🛒 ShopEasy</h2>

    <div>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('cart') }}">
            Cart 🛒
        </a>

    </div>

</nav>

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}


{% block content %}

{% endblock %}


<footer>

    <p>
        © 2026 ShopEasy | Python Flask E-Commerce Project
    </p>

</footer>

</body>

</html>
